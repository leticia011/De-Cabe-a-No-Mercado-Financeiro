<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entre e ganhe o capítulo 1 e a aula de carreira | Bankers Academy</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="icon" href="assets/favicon-192.png" sizes="192x192" type="image/png"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="global-header.css?v=16">
<link rel="stylesheet" href="rodape.css?v=1">
<link rel="stylesheet" href="login.css?v=8">
<script src="global-header.js?v=17" defer></script>
</head>
<body>

<header class="bar"><div class="bar-in"><a class="brand" href="index.html">Bankers Academy</a></div></header>

<section class="login-section">
  <div class="login-card">
    <h1>Entre e ganhe o capítulo 1 e a aula de carreira.</h1>
    <p class="login-sub" id="login-sub">Preencha seus dados e receba tudo no seu e-mail.</p>
    <div class="login-ok" id="login-ok" hidden>
      <p>Você já resgatou o capítulo 1 e a aula. Fique de olho no seu e-mail.</p>
      <button type="button" class="login-refazer" id="login-refazer">Entrar com outro e-mail</button>
    </div>
    <form id="form-login" data-rd-form="capitulo-1-login" novalidate>
      <div class="login-campo">
        <label for="login-nome">Nome completo</label>
        <input type="text" id="login-nome" name="name" autocomplete="name" required>
      </div>
      <div class="login-campo">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" name="email" autocomplete="email" required>
      </div>
      <div class="login-campo">
        <label for="login-telefone">Telefone</label>
        <input type="tel" id="login-telefone" name="phone" autocomplete="tel" inputmode="tel" required>
      </div>
      <div class="login-campo">
        <label for="login-nascimento">Data de nascimento</label>
        <input type="text" id="login-nascimento" name="birthdate" autocomplete="bday" inputmode="numeric" placeholder="DD/MM/AAAA" maxlength="10" required>
      </div>
      <button type="submit" class="login-entrar">Receber gratuitamente</button>
      <p class="login-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>

<footer><div class="wrap">De cabeça no mercado financeiro · José Roberto Securato Junior</div></footer>

<script>
(() => {
  const TELEFONE_MINIMO = 10;
  const somenteDigitos = valor => valor.replace(/\D/g, '');
  // Campo de texto com máscara em vez de <input type="date">: o placeholder
  // do seletor nativo segue o idioma do navegador, não o da página, e em
  // navegador/SO em inglês aparecia "yyyy" mesmo com o site em português.
  const formatarNascimento = valor => {
    const digitos = somenteDigitos(valor).slice(0, 8);
    if (digitos.length > 4) return `${digitos.slice(0, 2)}/${digitos.slice(2, 4)}/${digitos.slice(4)}`;
    if (digitos.length > 2) return `${digitos.slice(0, 2)}/${digitos.slice(2)}`;
    return digitos;
  };
  const nascimentoValido = valor => {
    const m = valor.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (!m) return false;
    const dia = Number(m[1]), mes = Number(m[2]), ano = Number(m[3]);
    const data = new Date(ano, mes - 1, dia);
    return data.getFullYear() === ano && data.getMonth() === mes - 1 && data.getDate() === dia;
  };
  const nascimentoParaISO = valor => {
    const [dia, mes, ano] = valor.split('/');
    return `${ano}-${mes}-${dia}`;
  };
  const form = document.getElementById('form-login');
  const nome = document.getElementById('login-nome');
  const email = document.getElementById('login-email');
  const telefone = document.getElementById('login-telefone');
  const nascimento = document.getElementById('login-nascimento');
  const status = document.querySelector('.login-status');
  const aviso = mensagem => { status.textContent = mensagem; };
  const ok = document.getElementById('login-ok');
  const refazer = document.getElementById('login-refazer');

  const dest = new URLSearchParams(location.search).get('dest');
  if (dest === 'whatsapp') {
    document.getElementById('login-sub').textContent = 'Entre para falar com a gente no WhatsApp.';
  }

  // Sem backend: quem já resgatou (nesse navegador) não precisa ver o
  // formulário nas visitas seguintes, exceto vindo pelo link do WhatsApp,
  // que é outro objetivo apesar de usar o mesmo formulário.
  let cp1Resgatado = false;
  try { cp1Resgatado = localStorage.getItem('cp1Resgatado') === '1'; } catch { /* sem memória disponível, mostra o formulário normalmente */ }
  if (cp1Resgatado && dest !== 'whatsapp') {
    form.hidden = true;
    ok.hidden = false;
  }
  refazer.addEventListener('click', () => {
    ok.hidden = true;
    form.hidden = false;
    nome.focus();
  });

  nascimento.addEventListener('input', () => {
    nascimento.value = formatarNascimento(nascimento.value);
  });

  form.addEventListener('submit', event => {
    event.preventDefault();
    if (!nome.value.trim()) { aviso('Informe o seu nome.'); nome.focus(); return; }
    if (!email.value.trim() || !email.checkValidity()) { aviso('Digite um e-mail válido.'); email.focus(); return; }
    if (somenteDigitos(telefone.value).length < TELEFONE_MINIMO) { aviso('Informe um telefone com DDD.'); telefone.focus(); return; }
    if (!nascimentoValido(nascimento.value)) { aviso('Informe uma data de nascimento válida (DD/MM/AAAA).'); nascimento.focus(); return; }

    document.dispatchEvent(new CustomEvent('rd-lead', {
      detail: {
        name: nome.value.trim(),
        email: email.value.trim(),
        phone: telefone.value.trim(),
        birthdate: nascimentoParaISO(nascimento.value),
        form: form.dataset.rdForm,
      },
    }));

    if (dest === 'whatsapp') {
      aviso('Pronto! Te levando para o WhatsApp…');
      setTimeout(() => { location.href = 'https://wa.me/5511990070784'; }, 900);
    } else {
      aviso('Pronto! Em instantes o capítulo e a aula chegam no seu e-mail.');
      form.reset();
    }
  });
})();
</script>
<script src="rd-station.js?v=3" defer></script>
<script src="rodape.js?v=4" defer></script>
</body>
</html>
